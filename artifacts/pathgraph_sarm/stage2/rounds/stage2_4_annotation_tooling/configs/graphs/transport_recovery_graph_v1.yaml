- id: in_transit_to_dropped_or_misaligned
  src: in_transit
  dst: dropped_or_misaligned
  type: failure
  description: object lost
  guard_condition: relative pose invalid
  completion_condition: drop evidence
  repeatable: true
  attempt_group: transport
  base_step_cost: 1
  max_repeat_before_stagnation: 3
- id: in_transit_to_terminal_failure
  src: in_transit
  dst: terminal_failure
  type: failure
  description: unrecoverable terminal failure
  guard_condition: terminal failure evidence
  completion_condition: episode termination
  repeatable: false
  attempt_group: transport
  base_step_cost: 1
  max_repeat_before_stagnation: 3
- id: dropped_or_misaligned_to_recovery
  src: dropped_or_misaligned
  dst: recovery
  type: recovery
  description: recovery action starts
  guard_condition: new approach action
  completion_condition: recovery begins
  repeatable: true
  attempt_group: recovery
  base_step_cost: 1
  max_repeat_before_stagnation: 3
- id: recovery_to_grasped
  src: recovery
  dst: grasped
  type: recovery
  description: stable regrasp
  guard_condition: grasp stability
  completion_condition: grasped stable
  repeatable: true
  attempt_group: grasp
  base_step_cost: 1
  max_repeat_before_stagnation: 3
- id: stagnation_loop
  src: recovery
  dst: recovery
  type: stagnation
  description: no effective progress
  guard_condition: motion/action below threshold
  completion_condition: 30-frame window
  repeatable: true
  attempt_group: recovery
  base_step_cost: 0
  max_repeat_before_stagnation: 3
path_templates:
- - start
  - grasped
  - in_transit
  - placed
  - success
- - start
  - grasped
  - in_transit
  - dropped_or_misaligned
  - recovery
  - grasped
  - in_transit
  - placed
  - success
history_policy: retain complete episode; recovery requires prior failure
progress_policy: 0, .25, .5, .75, 1 anchors
