[project]
name = "cp-disr-experiments"
version = "0.0.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.7.1", "torch-geometric==2.6.1", "numpy==1.26.4",
  "pandas==2.2.3", "matplotlib==3.9.4", "jsonschema==4.23.0",
  "PyYAML==6.0.2", "tensorboard==2.19.0", "pytest==8.3.5",
  "gymnasium==1.1.1", "dashscope==1.27.6"
]
[tool.uv.sources]
torch = { index = "pytorch-cu126" }
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[project.scripts]
cp-disr = "cp_disr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
