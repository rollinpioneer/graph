id: 2A
part: III
name: Core Exploration Runs
type: Exploration
purpose: 在两个结构任务中观察四个核心方法的学习现象，确定任务展示价值与适合的预算。
paper: OPTIONAL：第一版Results可用，必须标exploratory
prerequisites: 1A PASS或1B选定有效配置；T_A/T_C均已绑定；B0/B1代码和Q头已通过相关0B测试；train64/dev20 cache齐全。
inputs: 当前resolved defaults/1B选定config；T_A/T_C及其同task dev；B0/B1/B2/Full；seeds012；从头初始化；v2.1
  commit、平台、合同、evaluator、cache冻结。
frozen: 方法核心、各task及split、reward、观测/技能/mask、80/20；每个run内config锁定。
tunable: run之间允许第7.2章有限单变量适配；额外≤4诊断job或一次第3task完整12job，均新revision；默认矩阵不自动扩。
