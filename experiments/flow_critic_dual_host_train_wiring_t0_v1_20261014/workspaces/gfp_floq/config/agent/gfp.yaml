agent_name: "gfp"

# Tuned hyperparameters:
alpha: 1.
eta_temperature: 1e-3

# May vary depending on the benchmark/env:
q_agg: "mean" # Options: mean, min
target_agg: "actor" # Options: actor, flow, min, mean, max => By default "actor", sometimes "mean"
guidance_agg: "actor" # Options: actor, flow, min, mean, max => Always "actor" but use to be "min"
flow_steps: 10
eta_temperature_online: null # default to eta_temperature

# Fixed:
guidance_fn: "softmax" # Options: softmax, advantage => advantage was used for an ablation study, see Appendix B.2 in the paper
normalize_q_loss: True
target_use_next: False
encode_time_dim: 64
# New floq-critic option; host name stays gfp for CSV matching.
critic_type: "scalar"
activate_before_layernorm: true
block_depth: 4
block_width: 512
critic_flow_steps: 8
distill_num_ensembles: 2
embed_time: true
flow_num_ensembles: 2
noise_coverage: 0.1
noise_samples: 8
num_bins: 51
num_transformations: 2
reward_offset: 0.01
sigma: 16.0
time_embed_dim: 64
train_at_zero_only: false
use_prob_embed: true
use_resnets: false
training_authorized: false
optimizer_steps_allowed: 0
online_learning_allowed: false
